<text x="20" y="480" font-size="10" fill="#777">notes: the two descriptive tracks are independent — the WORD tier states sound (mention), the DEVICE tier enacts it (叠字/rep/allit) — and on this line they travel together in every reviving seat. Scalar reads the mention weakly (+0.03…+0.04; onomatopoeia is rare vocabulary) except Xu’s tune (+0.24): booleans carry the evidence here, heat shown honestly. Sound-referent: not per-line-instrumented on this board. Verdicts poem-grain.</text>
<text x="20" y="496" font-size="10" fill="#777">sources: descriptive/latent tiaotiao _56 jsons (post-rerun, registration 0726, invariance 0/12,843) + archived UNREDACTED table for line text. Owen’s cell may only be cited with its ⚑ (his “clacking” falls through the noun-closure’s documented verb-gap — part instrument, part choice).</text>
<text x="20" y="512" font-size="10" fill="#a33">F9: UNREDACTED — rendering lines quoted; local tier only, never into released files.</text>
