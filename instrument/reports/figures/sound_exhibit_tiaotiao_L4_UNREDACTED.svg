<text x="20" y="30" font-size="17" font-weight="bold">「迢迢牽牛星」第四行 札札弄機杼 — the loom’s sound, per seat: word · device · graph</text>
<text x="20" y="50" font-size="11" fill="#555">the source imitates the loom (叠字, green); four translators STATE the sound (word-tier, red) and imitate the imitation (rep/allit, green); one loses it to a verb; the shuttle’s own graph 杼 (amber) carries it underneath. All receipts committed, post-rerun (registration 0726).</text>
<text x="175" y="82" font-size="10.5" font-weight="bold" fill="#333">line (device green · word red · carrier amber)</text>
<text x="570" y="82" font-size="10.5" font-weight="bold" fill="#333">述·词 word-tier</text>
<text x="810" y="82" font-size="10.5" font-weight="bold" fill="#333">述·律 sound-device</text>
<text x="965" y="82" font-size="10.5" font-weight="bold" fill="#333">scalar</text>
<text x="1042" y="82" font-size="10.5" font-weight="bold" fill="#333">载·字形 written</text>
<text x="1230" y="82" font-size="10.5" font-weight="bold" fill="#333">state</text>
<text x="1400" y="82" font-size="10.5" font-weight="bold" fill="#333">transmission (poem grain)</text>
<g>
<text x="20" y="116" font-size="12" font-weight="bold">源 十九首·迢迢牽牛星</text>
